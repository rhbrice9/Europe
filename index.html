<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Europe 2026 · Group Trip Itinerary</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: #0a0a14; overflow: hidden; }
.orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.5; pointer-events: none; z-index: 0; animation: drift 18s ease-in-out infinite; }
.orb1 { width:600px;height:600px;background:radial-gradient(circle,#1a6e8a,transparent 70%);top:-10%;left:-10%; }
.orb2 { width:500px;height:500px;background:radial-gradient(circle,#6a1a7a,transparent 70%);top:30%;right:-8%;animation-delay:-6s; }
.orb3 { width:700px;height:700px;background:radial-gradient(circle,#1a5a3a,transparent 70%);bottom:10%;left:20%;animation-delay:-12s; }
.orb4 { width:400px;height:400px;background:radial-gradient(circle,#8a6a1a,transparent 70%);top:60%;right:25%;animation-delay:-4s; }
@keyframes drift { 0%,100%{transform:translate(0,0)} 33%{transform:translate(40px,-30px)} 66%{transform:translate(-25px,20px)} }
.glass { background:rgba(255,255,255,0.13); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%); border:1px solid rgba(255,255,255,0.4); border-radius:18px; box-shadow:0 8px 32px rgba(0,0,0,0.2),0 1.5px 0 rgba(255,255,255,0.45) inset; }
.app-layout { position:relative; z-index:1; display:flex; height:100vh; height:100dvh; overflow:hidden; }
.itinerary-panel { flex:1; overflow-y:auto; padding:28px 24px 80px; min-width:0; }
.chat-panel-wrapper { width:320px; flex-shrink:0; border-left:1px solid rgba(255,255,255,0.1); background:rgba(0,0,0,0.35); backdrop-filter:blur(20px); display:flex; flex-direction:column; transition:width 0.3s ease; overflow:hidden; }
.chat-panel-wrapper.sidebar-closed { width:48px; }
.chat-inner { display:flex; flex-direction:column; flex:1; min-height:0; }
.chat-messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:88%; padding:10px 13px; border-radius:14px; font-size:12.5px; line-height:1.5; word-break:break-word; }
.msg-user { align-self:flex-end; background:rgba(90,176,245,0.25); border:1px solid rgba(90,176,245,0.35); color:rgba(255,255,255,0.9); border-radius:14px 14px 4px 14px; }
.msg-ai { align-self:flex-start; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.85); border-radius:14px 14px 14px 4px; }
.msg-ai.thinking { opacity:0.6; font-style:italic; }
.chat-input-row { display:flex; gap:8px; padding:10px 12px; border-top:1px solid rgba(255,255,255,0.1); flex-shrink:0; }
.chat-input { flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); border-radius:10px; padding:8px 12px; color:#fff; font-size:12.5px; font-family:inherit; resize:none; outline:none; }
.chat-input::placeholder { color:rgba(255,255,255,0.3); }
.chat-send { background:rgba(90,176,245,0.3); border:1px solid rgba(90,176,245,0.5); color:#fff; border-radius:10px; padding:8px 14px; font-size:12px; cursor:pointer; font-family:inherit; white-space:nowrap; touch-action:manipulation; }
.chat-send:hover { background:rgba(90,176,245,0.45); }
.chat-send:disabled { opacity:0.4; cursor:default; }
.toggle-row { padding:14px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; flex-shrink:0; -webkit-tap-highlight-color:transparent; user-select:none; }
::-webkit-scrollbar{width:4px;height:4px} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}
.item-must{color:#ffb3b3;} .item-nice{color:#b3ffd4;} .item-note{color:rgba(255,255,255,0.42);font-style:italic;font-size:11.5px;} .item-bullet{color:rgba(255,255,255,0.8);}
@media (max-width: 768px) {
  .app-layout { flex-direction:column; }
  .itinerary-panel { padding:16px 14px 16px; }
  .chat-panel-wrapper { width:100% !important; height:52px; flex-shrink:0; border-left:none; border-top:1px solid rgba(255,255,255,0.15); transition:height 0.35s cubic-bezier(0.4,0,0.2,1); }
  .chat-panel-wrapper.sheet-open { height:55vh; }
  .sidebar-chevron { display:none !important; }
  .sheet-chevron { display:block !important; }
}
@media (min-width: 769px) { .sheet-chevron { display:none !important; } }
@media (max-width: 480px) { .hero-title { font-size:34px !important; } .city-header-name { font-size:18px !important; } }
</style>
</head>
<body>
<div id="root"></div>

function DayCard({ day }) {
  const [open, setOpen] = useState(true);
  return (
    <div style={{marginBottom:10,borderRadius:16,overflow:"hidden",background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)"}}>
      <div onClick={()=>setOpen(o=>!o)} style={{display:"flex",alignItems:"center",gap:10,padding:"11px 16px",cursor:"pointer",background:"rgba(255,255,255,0.05)",WebkitTapHighlightColor:"transparent",userSelect:"none"}}>
        <span style={{fontSize:10,letterSpacing:"0.12em",textTransform:"uppercase",color:"rgba(255,255,255,0.4)",flexShrink:0}}>{day.date}</span>
        <span style={{flex:1,fontSize:13,fontWeight:600,color:"rgba(255,255,255,0.9)",minWidth:0}}>{day.title}</span>
        <span style={{color:"rgba(255,255,255,0.3)",fontSize:10,transform:open?"rotate(180deg)":"none",transition:"0.2s",flexShrink:0}}>▼</span>
      </div>
      {open && (
        <div style={{padding:"10px 16px",display:"flex",flexDirection:"column",gap:2}}>
          {day.items.map((item,i)=>(
            <div key={i} style={{display:"flex",gap:8,padding:"5px 0",borderBottom:i<day.items.length-1?"1px solid rgba(255,255,255,0.05)":"none"}}>
              <span style={{flexShrink:0,fontSize:13}}>{item.icon}</span>
              <span className={"item-"+item.type} style={{fontSize:12.5,lineHeight:1.5}}>{item.text}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

      <div className="glass" style={{display:"flex",alignItems:"center",gap:12,padding:"16px 20px",marginBottom:12,background:`linear-gradient(135deg,${city.color}55 0%,rgba(255,255,255,0.07) 100%)`,borderColor:city.border}}>
        <span style={{fontSize:26}}>{city.emoji}</span>
        <div style={{flex:1,minWidth:0}}>
          <div className="city-header-name" style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:700,color:"#fff"}}>{city.name}</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.5)",marginTop:2}}>{city.dates}</div>
        </div>
        <span style={{fontSize:10,padding:"4px 10px",borderRadius:100,background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.18)",color:"rgba(255,255,255,0.6)",flexShrink:0,textAlign:"right"}}>{city.who}</span>
      </div>
      {city.days.map((day,i)=><DayCard key={i} day={day}/>)}
      {city.trains?.map((t,i)=>(
        <div key={i} style={{display:"flex",gap:10,padding:"12px 14px",background:"rgba(150,100,255,0.1)",border:"1px solid rgba(150,100,255,0.25)",borderRadius:12,marginTop:8}}>
          <span style={{fontSize:18}}>{t.icon}</span>
          <div style={{minWidth:0}}>
            <div style={{fontSize:12,fontWeight:600,color:"rgba(200,170,255,0.9)",marginBottom:2}}>{t.label}</div>
            <div style={{fontSize:11.5,color:"rgba(255,255,255,0.5)",lineHeight:1.5}}>{t.detail}</div>
          </div>

      ))}

function App() {
  const [itinerary, setItinerary] = useState(ITINERARY);
  const [messages, setMessages] = useState([
    {role:"ai",text:"Hi! I'm your trip assistant. Ask me to add activities, swap days, update recommendations, and more!"}
  ]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [chatOpen, setChatOpen] = useState(false);
  const [isMobile, setIsMobile] = useState(window.innerWidth <= 768);
  const endRef = useRef(null);

  useEffect(()=>{
    const fn = ()=>setIsMobile(window.innerWidth<=768);
    window.addEventListener("resize",fn);
    return ()=>window.removeEventListener("resize",fn);
  },[]);

  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:"smooth"}); },[messages]);

  const send = async ()=>{
    if(!input.trim()||loading) return;
    const userMsg = input.trim();
    setInput("");
    setMessages(m=>[...m,{role:"user",text:userMsg}]);
    setLoading(true);

    const sys = `You are a travel assistant embedded inside an interactive Europe trip itinerary app.
When the user asks to make changes, respond ONLY with valid JSON in this exact format:
{"message":"friendly explanation (plain text, no markdown)","updatedItinerary":{...complete itinerary...}}
If just answering a question:
{"message":"your answer","updatedItinerary":null}
RULES: Always valid JSON. When updating, return COMPLETE itinerary. Keep all structure intact.
Shape: {travelers:[...],cities:[...]}. Each city: id,name,emoji,dates,color,border,who,days,trains(opt).
Each day: date,title,who,items. Each item: type("must"|"nice"|"bullet"|"note"),icon(emoji),text.
Current itinerary: ${JSON.stringify(itinerary)}`;

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:4000,
          system:sys,
          messages:[
            ...messages.filter((m,i)=>m.role!=="ai"||i===0).slice(-6).map(m=>({
              role:m.role==="user"?"user":"assistant",
              content:m.role==="ai"?JSON.stringify({message:m.text,updatedItinerary:null}):m.text
            })),
            {role:"user",content:userMsg}
          ]
        })
      });
      const data = await res.json();
      const raw = data.content?.[0]?.text||"{}";
      let parsed;
      try { parsed = JSON.parse(raw.replace(/```json\n?/g,"").replace(/```\n?/g,"").trim()); }
      catch { parsed = {message:raw,updatedItinerary:null}; }
      setMessages(m=>[...m,{role:"ai",text:parsed.message||"Done!"}]);
      if(parsed.updatedItinerary) setItinerary(parsed.updatedItinerary);
    } catch {
      setMessages(m=>[...m,{role:"ai",text:"Sorry, something went wrong. Please try again."}]);
    }
    setLoading(false);
  };

  const wrapClass = ["chat-panel-wrapper",
    !isMobile&&!chatOpen?"sidebar-closed":"",
    isMobile&&chatOpen?"sheet-open":""
  ].filter(Boolean).join(" ");

  return (
    <div className="app-layout">
      {/* Itinerary */}
      <div className="itinerary-panel">
        {/* Hero */}
        <div className="glass" style={{textAlign:"center",padding:"36px 20px 28px",marginBottom:16,background:"linear-gradient(135deg,rgba(255,255,255,0.2),rgba(255,255,255,0.07))",borderRadius:24,position:"relative",overflow:"hidden"}}>
          <div style={{position:"absolute",top:0,left:0,right:0,height:1,background:"linear-gradient(90deg,transparent,rgba(255,255,255,0.8),transparent)"}}/>
          <div style={{fontSize:10,letterSpacing:"0.22em",textTransform:"uppercase",color:"rgba(255,255,255,0.45)",marginBottom:10}}>Group Travel Itinerary</div>
          <div className="hero-title" style={{fontFamily:"'Playfair Display',serif",fontSize:"clamp(32px,8vw,52px)",fontWeight:700,color:"#fff",letterSpacing:"-0.02em",lineHeight:1.1,marginBottom:8}}>Europe 2026</div>
          <div style={{fontSize:13,color:"rgba(255,255,255,0.55)",letterSpacing:"0.06em"}}>August 27 – September 10</div>
          <div style={{display:"flex",justifyContent:"center",gap:8,marginTop:16,flexWrap:"wrap"}}>
            {[["🍀 Dublin","#5dda8a","rgba(93,218,138,0.3)","rgba(93,218,138,0.12)"],
              ["🇬🇧 London","#5ab0f5","rgba(90,176,245,0.3)","rgba(90,176,245,0.12)"],
              ["🌼 Paris","#f07aaa","rgba(240,122,170,0.3)","rgba(240,122,170,0.12)"],
              ["🧇 Brussels","#f0c95a","rgba(240,201,90,0.3)","rgba(240,201,90,0.12)"]
            ].map(([l,c,b,bg])=>(
              <span key={l} style={{padding:"4px 12px",borderRadius:100,fontSize:11,fontWeight:500,color:c,border:`1px solid ${b}`,background:bg}}>{l}</span>
            ))}
          </div>
        </div>
        {/* Legend */}
        <div className="glass" style={{display:"flex",gap:12,flexWrap:"wrap",padding:"10px 16px",marginBottom:16,alignItems:"center"}}>
          {[["#ff6b6b","0 0 8px rgba(255,107,107,0.6)","Must-Have"],["#6bffa8","0 0 8px rgba(107,255,168,0.6)","Nice-to-Have"],["rgba(255,255,255,0.5)","none","Suggested"]].map(([c,s,l])=>(
            <div key={l} style={{display:"flex",alignItems:"center",gap:6,fontSize:11,color:"rgba(255,255,255,0.65)"}}>
              <span style={{width:7,height:7,borderRadius:"50%",background:c,boxShadow:s,flexShrink:0}}/>{l}
            </div>
          ))}
          <div style={{marginLeft:"auto",fontSize:11,color:"rgba(255,220,150,0.7)"}}>⚠ Note</div>
        </div>
        {/* Travelers */}
        <div style={{fontSize:10,letterSpacing:"0.18em",textTransform:"uppercase",color:"rgba(255,255,255,0.35)",marginBottom:8,paddingLeft:4}}>Travelers</div>
        <div className="glass" style={{padding:"12px 16px",marginBottom:20,display:"flex",flexWrap:"wrap",gap:8}}>
          {itinerary.travelers.map(t=>(
            <span key={t} style={{padding:"4px 12px",borderRadius:100,fontSize:12,background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.16)",color:"rgba(255,255,255,0.8)"}}>{t}</span>
          ))}
        </div>
        {itinerary.cities.map(city=><CitySection key={city.id} city={city}/>)}
        <div style={{textAlign:"center",fontSize:11,color:"rgba(255,255,255,0.25)",marginTop:8,paddingBottom:8}}>Safe travels ✈️ · Europe Trip 2026</div>
      </div>

      {/* Chat */}
      <div className={wrapClass}>
        <div className="toggle-row" onClick={()=>setChatOpen(o=>!o)} style={{borderBottom:chatOpen?"1px solid rgba(255,255,255,0.1)":"none"}}>
          <span style={{fontSize:16}}>✨</span>
          <span style={{fontSize:12,fontWeight:600,color:"rgba(255,255,255,0.8)",whiteSpace:"nowrap"}}>Trip Assistant</span>
          <span className="sidebar-chevron" style={{marginLeft:"auto",color:"rgba(255,255,255,0.4)",fontSize:11}}>{chatOpen?"◀":"▶"}</span>
          <span className="sheet-chevron" style={{marginLeft:"auto",color:"rgba(255,255,255,0.4)",fontSize:11,display:"none"}}>{chatOpen?"▼":"▲"}</span>
        </div>
        {chatOpen && (
          <div className="chat-inner">
            <div className="chat-messages">
              {messages.map((m,i)=>(
                <div key={i} className={`msg msg-${m.role}`}>{m.text}</div>
              ))}
              {loading && <div className="msg msg-ai thinking">Thinking…</div>}
              <div ref={endRef}/>
            </div>
            <div className="chat-input-row">
              <textarea className="chat-input" rows={2} placeholder="Ask me to change anything…"
                value={input} onChange={e=>setInput(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
              />
              <button className="chat-send" onClick={send} disabled={loading||!input.trim()}>Send</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  React.createElement(React.Fragment, null,
    React.createElement("div",{className:"orb orb1"}),
    React.createElement("div",{className:"orb orb2"}),
    React.createElement("div",{className:"orb orb3"}),
    React.createElement("div",{className:"orb orb4"}),
    React.createElement(App)
  )
);
</script>
</body>
</html>
